<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 348" width="900" height="348" role="img" aria-label="Claude Notch (2026, Yeni). Claude Code'u üç projede çalıştırıp başka pencereye geçince hangisinin bittiğini kaçırıyordum. Ekranın üstüne Dynamic Island gibi bir çentik yaptım: Claude içinde koşuyor, kota sıvı gibi doluyor. Hiç token harcamıyor. Teknolojiler: Tauri 2, Rust, JavaScript, Claude Code hooks, Codex.">
  <title>Claude Notch (2026, Yeni). Claude Code ve Codex için ekranın üstünde koşan bir çentik.</title>
  <defs>
    <linearGradient id="sc0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141826"/><stop offset="1" stop-color="#0A0C12"/></linearGradient>
    <radialGradient id="sc1" cx="15%" cy="30%" r="60%"><stop offset="0" stop-color="#D97757" stop-opacity=".55"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient>
    <radialGradient id="sc2" cx="88%" cy="35%" r="60%"><stop offset="0" stop-color="#365CAA" stop-opacity=".65"/><stop offset="1" stop-color="#365CAA" stop-opacity="0"/></radialGradient>
    <clipPath id="screen"><rect x="44" y="44" width="288" height="206" rx="9"/></clipPath>
    <clipPath id="gl"><circle r="12"/></clipPath>
    <path id="wave" d="M-20 0 q2.5 -1.8 5 0 t5 0 t5 0 t5 0 t5 0 t5 0 t5 0 t5 0 t5 0 t5 0 t5 0 t5 0 V30 H-20 Z"/>
    <g id="runner" shape-rendering="crispEdges">
      <rect class="line l1" x="-3" y="1" width="4" height="1"/><rect class="line l2" x="-5" y="3" width="5" height="1"/><rect class="line l3" x="-2" y="6.5" width="3" height="1"/>
      <g class="body">
        <g class="leg-a"><rect x="4" y="8" width="1" height="2"/><rect x="11" y="8" width="1" height="2"/></g>
        <g class="leg-b"><rect x="6" y="8" width="1" height="2"/><rect x="13" y="8" width="1" height="2"/></g>
        <rect class="arm-l" x="1" y="4" width="2" height="2"/><rect class="arm-r" x="15" y="4" width="2" height="2"/>
        <rect x="3" y="0" width="12" height="8"/>
        <g class="eyes"><rect x="5" y="2" width="1" height="2"/><rect x="12" y="2" width="1" height="2"/></g>
      </g>
    </g>
    <g id="runner-mini" shape-rendering="crispEdges">
      <g class="body m">
        <g class="leg-a m"><rect x="4" y="8" width="1" height="2"/><rect x="11" y="8" width="1" height="2"/></g>
        <g class="leg-b m"><rect x="6" y="8" width="1" height="2"/><rect x="13" y="8" width="1" height="2"/></g>
        <rect class="arm-l m" x="1" y="4" width="2" height="2"/><rect class="arm-r m" x="15" y="4" width="2" height="2"/>
        <rect x="3" y="0" width="12" height="8"/>
        <g class="eyes"><rect x="5" y="2" width="1" height="2"/><rect x="12" y="2" width="1" height="2"/></g>
      </g>
    </g>
  </defs>
  <style>
    .t{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
    .claude{fill:#D97757}.codex{fill:#C8D0DB}
    .eyes rect{fill:#141413}
    .line{fill:#fff;opacity:0;animation:speed .6s linear infinite}
    .l2{animation-delay:-.2s}.l3{animation-delay:-.4s}
    .body{animation:bob .48s step-end infinite}
    .leg-a{animation:leg-a .48s step-end infinite}
    .leg-b{animation:leg-b .48s step-end infinite}
    .arm-l{animation:arm .48s step-end infinite}
    .arm-r{animation:arm .48s step-end infinite -.24s}
    .m{animation-duration:.38s}.arm-r.m{animation-delay:-.19s}
    .eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.4s linear infinite}
    .road{stroke:#fff;stroke-opacity:.32;stroke-width:1.6;stroke-dasharray:5 4;animation:road .35s linear infinite}
    .w{animation:wave 1.8s linear infinite}
    .w.back{opacity:.45;animation-duration:2.7s;animation-direction:reverse}
    .ok{fill:#34C77B}.warn{fill:#F5A524}
    .glow{animation:glow 2.8s ease-in-out infinite}
    @keyframes bob{0%{transform:translate(0,0)}25%{transform:translate(0,-1px)}50%{transform:translate(0,0)}75%{transform:translate(0,-1px)}}
    @keyframes leg-a{0%{transform:translate(1px,0)}25%{transform:translate(0,0)}50%{transform:translate(-1px,-1px)}75%{transform:translate(0,-1px)}100%{transform:translate(1px,0)}}
    @keyframes leg-b{0%{transform:translate(-1px,-1px)}25%{transform:translate(0,-1px)}50%{transform:translate(1px,0)}75%{transform:translate(0,0)}100%{transform:translate(-1px,-1px)}}
    @keyframes arm{0%{transform:translate(0,-1px)}50%{transform:translate(0,1px)}}
    @keyframes blink{0%,93%,97%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
    @keyframes speed{0%{transform:translateX(3px);opacity:0}25%{opacity:.55}100%{transform:translateX(-7px);opacity:0}}
    @keyframes road{to{stroke-dashoffset:9}}
    @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-10px)}}
    @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect width="900" height="348" rx="18" fill="#F2F4F1"/>
  <rect x=".75" y=".75" width="898.5" height="346.5" rx="17.25" fill="none" stroke="#DCE2DC" stroke-width="1.5"/>

  <!-- left: a small screen with the live notch -->
  <rect x="28" y="28" width="320" height="292" rx="14" fill="#EEF2EE" stroke="#DCE2DC" stroke-width="1.2"/>
  <g clip-path="url(#screen)">
    <rect x="44" y="44" width="288" height="206" fill="url(#sc0)"/>
    <rect x="44" y="44" width="288" height="206" fill="url(#sc1)"/>
    <rect x="44" y="44" width="288" height="206" fill="url(#sc2)"/>
    <rect x="66" y="148" width="140" height="78" rx="6" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".08"/>
    <rect x="44" y="232" width="288" height="18" fill="#0A0C12" fill-opacity=".65"/>
    <path class="glow" d="M76 44 H300 V100 a22 22 0 0 1 -22 22 H98 a22 22 0 0 1 -22 -22 Z" fill="none" stroke="#D97757" stroke-opacity=".45" stroke-width="1.5"/>
    <path d="M76 44 H300 V100 a22 22 0 0 1 -22 22 H98 a22 22 0 0 1 -22 -22 Z" fill="#000"/>
    <g transform="translate(101 74)">
      <circle r="12" fill="#fff" fill-opacity=".06"/>
      <g clip-path="url(#gl)"><g transform="translate(0 4)"><use href="#wave" class="w back ok"/><use href="#wave" class="w ok"/></g></g>
      <circle r="12.8" fill="none" stroke="#fff" stroke-opacity=".16"/>
      <text class="t" y="3" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff">34%</text>
      <text class="t" y="24" text-anchor="middle" font-size="7" fill="#8B919B">5h</text>
    </g>
    <g transform="translate(275 74)">
      <circle r="12" fill="#fff" fill-opacity=".06"/>
      <g clip-path="url(#gl)"><g transform="translate(0 -3)"><use href="#wave" class="w back warn"/><use href="#wave" class="w warn"/></g></g>
      <circle r="12.8" fill="none" stroke="#fff" stroke-opacity=".16"/>
      <text class="t" y="3" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff">62%</text>
      <text class="t" y="24" text-anchor="middle" font-size="7" fill="#8B919B">7d</text>
    </g>
    <line class="road" x1="136" y1="93" x2="246" y2="93"/>
    <use href="#runner" class="claude" transform="translate(146 70.4) scale(2.2)"/>
    <use href="#runner-mini" class="claude" transform="translate(196 83.8) scale(.9)"/>
    <use href="#runner-mini" class="codex" transform="translate(218 83.8) scale(.9)"/>
    <text class="t" x="188" y="110" text-anchor="middle" font-size="8.5" fill="#8B919B"><tspan fill="#F3F4F6" font-weight="600">3 proje</tspan> · 2 agent</text>
  </g>
  <text class="t" x="188" y="282" text-anchor="middle" font-size="12" font-weight="500" fill="#56625B">Ekranın üst ortası, her zaman görünür</text>

  <!-- right: story -->
  <text class="t" x="384" y="64" font-size="13.5" font-weight="600" fill="#56625B">2026</text>
  <rect x="428.5" y="47.5" width="52" height="23.5" rx="11.8" fill="#F8E3D9"/>
  <text class="t" x="454.5" y="64" text-anchor="middle" font-size="13.5" font-weight="600" fill="#B4532E">Yeni</text>
  <text class="t" x="384" y="108" font-size="28" font-weight="700" fill="#16201B" letter-spacing="-.2">Claude Notch</text>
  <text class="t" x="384" y="148" font-size="17" font-weight="500" fill="#56625B">Claude Code'u üç projede çalıştırıp başka pencereye</text>
  <text class="t" x="384" y="174" font-size="17" font-weight="500" fill="#56625B">geçince hangisinin bittiğini kaçırıyordum.</text>
  <text class="t" x="384" y="206" font-size="17" font-weight="500" fill="#16201B">Ekranın üstüne Dynamic Island gibi bir çentik yaptım:</text>
  <text class="t" x="384" y="232" font-size="17" font-weight="500" fill="#16201B">Claude içinde koşuyor, kota sıvı gibi doluyor.</text>
  <circle cx="389" cy="263" r="4" fill="#0E7A5A"/>
  <text class="t" x="402" y="268" font-size="15" font-weight="600" fill="#0E7A5A">Hiç token harcamıyor, yalnız yerel dosyaları okuyor</text>
  <g class="t" font-size="13" font-weight="500" fill="#56625B" text-anchor="middle">
    <rect x="384" y="288" width="64" height="26" rx="7.8" fill="none" stroke="#DCE2DC" stroke-width="1.5"/><text x="416" y="305.2">Tauri 2</text>
    <rect x="456" y="288" width="46" height="26" rx="7.8" fill="none" stroke="#DCE2DC" stroke-width="1.5"/><text x="479" y="305.2">Rust</text>
    <rect x="510" y="288" width="84" height="26" rx="7.8" fill="none" stroke="#DCE2DC" stroke-width="1.5"/><text x="552" y="305.2">JavaScript</text>
    <rect x="602" y="288" width="138" height="26" rx="7.8" fill="none" stroke="#DCE2DC" stroke-width="1.5"/><text x="671" y="305.2">Claude Code hooks</text>
    <rect x="748" y="288" width="58" height="26" rx="7.8" fill="none" stroke="#DCE2DC" stroke-width="1.5"/><text x="777" y="305.2">Codex</text>
  </g>
</svg>
